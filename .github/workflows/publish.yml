name: publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version files and tag
        run: |
          python3 - <<'PY'
          import json, os, re, sys

          tauri = json.load(open("src-tauri/tauri.conf.json", encoding="utf-8"))["version"]
          pkg = json.load(open("package.json", encoding="utf-8"))["version"]
          cargo = None
          for line in open("src-tauri/Cargo.toml", encoding="utf-8"):
              match = re.match(r'version = "([^"]+)"', line)
              if match:
                  cargo = match.group(1)
                  break

          if not (tauri == pkg == cargo):
              print(f"Version mismatch: package.json={pkg} tauri.conf.json={tauri} Cargo.toml={cargo}")
              sys.exit(1)

          ref = os.environ.get("GITHUB_REF", "")
          if ref.startswith("refs/tags/"):
              tag = os.environ["GITHUB_REF_NAME"]
              expected = f"v{tauri}"
              if tag != expected:
                  print(f"Tag {tag} does not match {expected}")
                  sys.exit(1)

          print(f"Version {tauri} OK")
          PY

  publish-tauri:
    needs: verify-version
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Sunlight v__VERSION__
          releaseBody: See the assets below to download this version. After this draft is published, installed apps can update from it.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          tauriScript: bun run tauri
          args: ${{ matrix.args }}
