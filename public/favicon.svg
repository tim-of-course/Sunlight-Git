<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sun-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2cc7f" />
      <stop offset="40%" stop-color="#e0aa43" />
      <stop offset="100%" stop-color="#b88514" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#5c420a" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Sun Background -->
  <rect width="512" height="512" rx="112" fill="url(#sun-grad)" />

  <!-- Sun ripple effects -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.3" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.2" />
  <circle cx="256" cy="256" r="100" fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.1" />

  <g filter="url(#shadow)">
    <!-- Git Branch Paths -->
    <g stroke="#FFFFFF" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Main S Curve -->
      <path d="M 336 176 
               A 80 80 0 0 0 176 176 
               A 80 80 0 0 0 256 256 
               A 80 80 0 0 1 336 336 
               A 80 80 0 0 1 176 336" />
      <!-- Left side branch -->
      <path d="M 176 176 L 136 176 Q 96 176, 96 216 Q 96 256, 136 256 L 256 256" />
      <!-- Right side branch -->
      <path d="M 256 256 L 376 256 Q 416 256, 416 296 Q 416 336, 376 336 L 336 336" />
    </g>

    <!-- Git Nodes -->
    <circle cx="336" cy="176" r="24" fill="#e0aa43" stroke="#FFFFFF" stroke-width="10" />
    <circle cx="176" cy="176" r="24" fill="#FFFFFF" stroke="none" />
    <circle cx="256" cy="256" r="28" fill="#b88514" stroke="#FFFFFF" stroke-width="12" />
    <circle cx="336" cy="336" r="24" fill="#FFFFFF" stroke="none" />
    <circle cx="176" cy="336" r="24" fill="#f2cc7f" stroke="#FFFFFF" stroke-width="10" />
    
    <!-- Side branch nodes -->
    <circle cx="96" cy="216" r="20" fill="#FFFFFF" stroke="none" />
    <circle cx="416" cy="296" r="20" fill="#FFFFFF" stroke="none" />
  </g>
</svg>
