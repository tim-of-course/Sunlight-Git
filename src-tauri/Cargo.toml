[package]
name = "sunlight-tauri"
version = "0.1.0"
description = "Sunlight — local multi-repository Git GUI"
authors = ["Sunlight"]
edition = "2021"

[lib]
name = "sunlight_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "sync", "time", "rt-multi-thread", "process", "io-util"] }
sha2 = "0.10"
base64 = "0.22"
regex = "1"
dirs = "6"
notify = "8.2"
wait-timeout = "0.2"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[patch.crates-io]
# GTK3 still requires glib 0.18; see vendor/glib-0.18.5/SUNLIGHT-PATCH.md.
glib = { path = "vendor/glib-0.18.5" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
glib = "0.18.5"

# The GLib FFI regression requires optimization to reproduce.
[profile.test.package.glib]
opt-level = 3
