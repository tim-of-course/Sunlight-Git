[package]
name = "sunlight-tauri"
version = "0.1.0"
description = "Sunlight — local multi-repository Git GUI"
authors = ["Sunlight"]
edition = "2021"

[lib]
name = "sunlight_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "sync", "time", "rt-multi-thread", "process", "io-util"] }
sha2 = "0.10"
base64 = "0.22"
regex = "1"
dirs = "6"
notify = "7"
wait-timeout = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }
